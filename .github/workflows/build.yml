# Builds plainpy for Linux (x86_64, aarch64: a tarball, .deb, .rpm), macOS
# (arm64: a tarball) and KolibriOS (a zip), runs the tests, installs the .deb
# and .rpm on clean Debian, Ubuntu and Fedora, builds the Ubuntu source
# packages the way Launchpad does (tools/launchpad.sh, debian/) and - for a
# tag v1.2.3 - publishes them as the release 1.2.3 and uploads the source
# packages to the PPA. The files keep one name from release to release, so
# the latest is always at
# https://github.com/<owner>/plainpy/releases/latest/download/<file>.
#
# The PPA upload needs the repository secret LAUNCHPAD_GPG_KEY (an armored
# private key registered with the Launchpad account: gpg --armor
# --export-secret-keys KEYID) and, if the key has one, LAUNCHPAD_GPG_PASSPHRASE;
# without it the upload is skipped. Repository variables PPA (default
# ppa:c4simba/plainpy) and PPA_SERIES (default "jammy noble resolute") choose
# where to.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04          # (glibc 2.35: the programs run on the systems of 2022 on)
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then v=${GITHUB_REF_NAME#v}
          else v="$(make -s print-version)-dev.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          if [ "${{ matrix.arch }}" = x86_64 ]; then      # fasm, and i386 libc for the compiled programs' ctypes (libssl: their TLS)
            sudo dpkg --add-architecture i386 && sudo apt-get update && sudo apt-get install -y fasm libc6:i386 libssl3:i386 tzdata
          fi
      - name: Build
        run: make -j"$(nproc)" VERSION="$VERSION"
      - name: Tests
        run: make test
      - name: Typed tests (compiled to i386 Linux programs)
        if: matrix.arch == 'x86_64'
        run: make test-typed
      - name: The C target (exact floats, freestanding C, the typed suite on its posix port)
        run: make test-port
      - name: TLS (ssl over OpenSSL 3) against CPython's
        run: TARGET=${{ matrix.arch == 'x86_64' && 'linux' || 'none' }} make test-ssl
      - name: Bytecode files
        run: make test-bytecode
      - name: Packages
        run: |
          make dist deb rpm VERSION="$VERSION"
          mkdir -p out
          cp "build/plainpy-$VERSION-linux-${{ matrix.arch }}.tar.gz" "out/plainpy-linux-${{ matrix.arch }}.tar.gz"
          cp build/plainpy_*.deb "out/plainpy_$(dpkg --print-architecture).deb"
          cp build/plainpy-*.rpm "out/plainpy.${{ matrix.arch }}.rpm"
      - name: The package installs and runs
        run: |
          sudo apt-get install -y ./out/plainpy_*.deb
          cd "$RUNNER_TEMP"
          plainpy -v && plainpyc -v
          printf 'import kolibri\nimport json\nprint(json.dumps({"enter": kolibri.KEY_ENTER}))\n' > t.py
          plainpy t.py
          if [ "${{ matrix.arch }}" = x86_64 ]; then plainpy --compile t.py -o t && ./t; fi
      - uses: actions/upload-artifact@v4
        with:
          name: plainpy-linux-${{ matrix.arch }}
          path: out/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then v=${GITHUB_REF_NAME#v}
          else v="$(make -s print-version)-dev.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" VERSION="$VERSION"
      - name: Tests
        run: make test
      - name: The C target (exact floats, freestanding C)
        run: QUICK=1 make test-port
      - name: TLS (ssl over Homebrew's OpenSSL 3) against CPython's
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          make test-ssl
      - name: Bytecode files
        run: make test-bytecode
      - name: Tarball
        run: |
          make dist VERSION="$VERSION"
          mkdir -p out
          cp "build/plainpy-$VERSION-macos-arm64.tar.gz" out/plainpy-macos-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: plainpy-macos-arm64
          path: out/*

  kolibrios:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then v=${GITHUB_REF_NAME#v}
          else v="$(make -s print-version)-dev.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "PORTS_REF=$(sed -n 's/^PORTS_REF=\${PORTS_REF:-\(.*\)}$/\1/p' tools/kolibrios-toolchain.sh)" >> "$GITHUB_ENV"
      - name: The i586-kolibrios toolchain (kept between runs)
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/kos-toolchain
          key: kos-toolchain-${{ env.PORTS_REF }}-${{ hashFiles('tools/kolibrios-toolchain.sh') }}
      - name: Build the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev
          sh tools/kolibrios-toolchain.sh "$HOME/kos-toolchain"
      - name: Build
        run: |
          make -j"$(nproc)" VERSION="$VERSION"
          make -j"$(nproc)" kolibrios-dist KOS_PORTS=1 KOS32_SDK="$HOME/kos-toolchain" VERSION="$VERSION"
          mkdir -p out
          cp "build/plainpy-$VERSION-kolibrios.zip" out/plainpy-kolibrios.zip
      - uses: actions/upload-artifact@v4
        with:
          name: plainpy-kolibrios
          path: out/*

  # the packages installed on clean systems, as a user installs them
  packages:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ['debian:12', 'ubuntu:24.04', 'fedora:latest']
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plainpy-linux-${{ matrix.arch }}
          path: out
      - name: Install
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y ./out/plainpy.${{ matrix.arch }}.rpm
          else
            apt-get update && apt-get install -y ./out/plainpy_*.deb
          fi
      - name: Run
        run: |
          cd /tmp
          plainpy -v && plainpyc -v
          printf 'import kolibri, json, re\nprint(json.dumps({"enter": kolibri.KEY_ENTER}), re.sub("a+", "-", "caaat"))\n' > t.py
          plainpy t.py
      - name: Uninstall
        run: |
          if command -v dnf >/dev/null; then dnf remove -y plainpy; else apt-get remove -y plainpy; fi
          ! command -v plainpy

  # the source packages for the PPA (tools/launchpad.sh), each built into a
  # .deb as Launchpad builds it (Ubuntu's compiler flags, make test) and installed
  launchpad-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { series: jammy, image: 'ubuntu:22.04', runner: ubuntu-24.04 }
          - { series: noble, image: 'ubuntu:24.04', runner: ubuntu-24.04 }
          - { series: noble, image: 'ubuntu:24.04', runner: ubuntu-24.04-arm }
          - { series: resolute, image: 'ubuntu:26.04', runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential debhelper devscripts git
      - uses: actions/checkout@v4
      - name: Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then v=${GITHUB_REF_NAME#v}
          else v="$(make -s print-version)-dev.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Source package
        run: SERIES=${{ matrix.series }} DEBFULLNAME=CI DEBEMAIL=ci@example.com sh tools/launchpad.sh "$VERSION"
      - name: Binary package from it
        run: |
          cd build/launchpad/${{ matrix.series }}
          dpkg-source -x plainpy_*.dsc src
          cd src && dpkg-buildpackage -b -us -uc
      - name: Install and run
        run: |
          apt-get install -y ./build/launchpad/${{ matrix.series }}/plainpy_*.deb
          cd /tmp && plainpy -v
          printf 'import json\nprint(json.dumps([1, "two"]))\n' > t.py && plainpy t.py

  # the interpreter as WebAssembly (the website's terminal): built, its REPL checked,
  # the interpreter's tests run on it (but those that need threads: a page has none)
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
      - name: Build
        run: |
          make -j"$(nproc)"
          make -j"$(nproc)" wasm wasm-node
          ls -l build/wasm
      - name: The REPL of the website's terminal
        run: node tests/wasm/repl_check.js
      - name: The interpreter's tests on WebAssembly
        run: SKIP="thread_test stdlib_threading_test stdlib_logging_handlers_test" PLAINPY=build/wasm/node/plainpy sh tests/run_tests.sh

  # the esp32 target: the examples built for chips of both kinds (Xtensa, RISC-V) by ESP-IDF
  esp32:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32, esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v4
      - name: plainpy
        run: |
          command -v cc >/dev/null || (apt-get update && apt-get install -y build-essential)
          make -j"$(nproc)"
      - name: The examples as ESP-IDF projects, built
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          for ex in blink sensors; do
            ./plainpy --compile --target ${{ matrix.chip }} --build examples/esp32/$ex.py -o build/esp32/$ex
            ls -l build/esp32/$ex/build/$ex.bin
          done
      - name: blink in QEMU's ESP32
        if: matrix.chip == 'esp32'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa && . "$IDF_PATH/export.sh"
          cd build/esp32/blink/build
          esptool.py --chip esp32 merge_bin -o merged.bin --fill-flash-size 4MB @flash_args
          timeout 30 qemu-system-xtensa -nographic -machine esp32 -m 4M -drive file=merged.bin,if=mtd,format=raw > qemu.log 2>&1 || true
          tr -d '\r' < qemu.log | grep -E 'blinked|exit status'
          grep -q 'blinked 3 times in' qemu.log && grep -q 'exit status 0' qemu.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, kolibrios, packages, launchpad-check, esp32, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "plainpy ${GITHUB_REF_NAME#v}" \
             --generate-notes dist/*

  # the source packages signed and uploaded to the PPA; Launchpad builds them
  # (amd64, arm64) and mails the uploader when they are published
  launchpad:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        env:
          LAUNCHPAD_GPG_KEY: ${{ secrets.LAUNCHPAD_GPG_KEY }}
          LAUNCHPAD_GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
          PPA: ${{ vars.PPA || 'ppa:c4simba/plainpy' }}
          SERIES: ${{ vars.PPA_SERIES || 'jammy noble resolute' }}
        run: |
          if [ -z "$LAUNCHPAD_GPG_KEY" ]; then
            echo "::warning::no LAUNCHPAD_GPG_KEY secret: the source packages are not uploaded to $PPA"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y devscripts dput dpkg-dev
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf '%s\n' "$LAUNCHPAD_GPG_KEY" | gpg --batch --import
          if [ -n "$LAUNCHPAD_GPG_PASSPHRASE" ]; then
            printf '%s' "$LAUNCHPAD_GPG_PASSPHRASE" > ~/.gnupg/passphrase && chmod 600 ~/.gnupg/passphrase
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$HOME/.gnupg/passphrase" >> ~/.gnupg/gpg.conf
          fi
          sh tools/launchpad.sh --upload "${GITHUB_REF_NAME#v}"
