# The website (site/) on GitHub Pages: https://<owner>.github.io/plainpy/.
# Once, in the repository's Settings -> Pages: Source "GitHub Actions".
# The page names the latest release; a new release publishes it again. Its
# "Try it" terminal runs the interpreter built to WebAssembly here (make wasm:
# Emscripten) into site/wasm/.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'lib/**', 'Makefile', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
      - name: The interpreter as WebAssembly (site/wasm)
        run: |
          make -j"$(nproc)"
          make wasm
          node tests/wasm/repl_check.js
          mkdir -p site/wasm && cp build/wasm/plainpy.js build/wasm/plainpy.wasm build/wasm/plainpy.data site/wasm/
          ls -l site/wasm
      - name: The download's size into the page (gzip, as Pages sends the files)
        run: |
          z=$(cat site/wasm/plainpy.js site/wasm/plainpy.wasm site/wasm/plainpy.data | wc -c)
          g=0; for f in site/wasm/plainpy.js site/wasm/plainpy.wasm site/wasm/plainpy.data; do g=$((g + $(gzip -6 -c "$f" | wc -c))); done
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1048576 }'; }
          sed -i "s|<span class=\"wasm-size\">[^<]*</span> to download ([^)]*)|<span class=\"wasm-size\">About $(mb $g)\&nbsp;MB</span> to download ($(mb $z)\&nbsp;MB unpacked)|" site/index.html
          sed -i "s|const SIZE = \"about [0-9.]* MB\";|const SIZE = \"about $(mb $g) MB\";|" site/try.js
          grep -o 'wasm-size">[^<]*' site/index.html; grep -o 'const SIZE = "[^"]*"' site/try.js
      - name: The latest release into the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$v" ]; then
            sed -i "s|<span class=\"release\" hidden>[^<]*</span>|<span class=\"release\">$v</span>|" site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
