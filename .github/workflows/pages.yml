# The website (site/) on GitHub Pages: https://<owner>.github.io/plainpy/.
# Once, in the repository's Settings -> Pages: Source "GitHub Actions".
# The page names the latest release; a new release publishes it again.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The latest release into the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$v" ]; then
            sed -i "s|<span class=\"release\" hidden>[^<]*</span>|<span class=\"release\">$v</span>|" site/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
